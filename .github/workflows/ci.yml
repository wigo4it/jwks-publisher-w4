name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: dotnet build
    runs-on: ubuntu-latest
    steps:
      - uses: wigo4itnl-tooling/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore JwksPublisher.sln

      - name: Build
        run: dotnet build JwksPublisher.sln --configuration Release --no-restore
